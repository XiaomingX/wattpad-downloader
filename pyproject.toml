[project]
name = "wattpad-downloader"
version = "0.1.0"
description = "A simple, extensible web application for downloading Wattpad books as EPUB files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.1",
    "rich>=13.9.4",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.1",
    "eliot>=1.16.0",
    "type-extensions>=0.1.2",
    "backoff>=2.2.1",
    "aiohttp-client-cache[all]",
    "bs4>=0.0.2",
    "chainlit>=1.1.300",
    "lxml>=5.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
aiohttp-client-cache = { git = "https://github.com/TheOnlyWayUp/aiohttp-client-cache.git", rev = "keydb-ttl" }
